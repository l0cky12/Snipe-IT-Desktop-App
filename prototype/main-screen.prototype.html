<!doctype html>
<!--
  PROTOTYPE — throwaway. Do not ship, do not import.
  Question: what should the Snipe-IT Desktop main screen look like (layout + density)?
  Three structurally different variants, switchable via ?variant=A|B|C, the bottom bar, or ←/→.
  All data is fake and hardcoded. Checkout/Checkin buttons are stubs.
  Run: xdg-open prototype/main-screen.prototype.html   (or double-click it)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE — Snipe-IT Desktop main screen</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --line: #2a3140;
    --text: #d6dde8; --dim: #8591a3; --accent: #4ea1ff;
    --green: #2ea043; --amber: #d29922; --red: #e5534b; --grey: #6e7681; --blue: #388bfd;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    --sans: system-ui, "Segoe UI", Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body, #app { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); }
  button { font: inherit; cursor: pointer; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 3px;
          font: 600 11px/1.6 var(--mono); text-transform: uppercase; letter-spacing: .04em; border: 1px solid; white-space: nowrap; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .c-green { color: var(--green); border-color: #2ea04355; background: #2ea04318; }
  .c-amber { color: var(--amber); border-color: #d2992255; background: #d2992218; }
  .c-red   { color: var(--red);   border-color: #e5534b55; background: #e5534b18; }
  .c-grey  { color: var(--grey);  border-color: #6e768155; background: #6e768118; }
  .c-blue  { color: var(--blue);  border-color: #388bfd55; background: #388bfd18; }
  .mono { font-family: var(--mono); }
  .dim { color: var(--dim); }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); padding: 6px 14px; border-radius: 4px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #041222; font-weight: 600; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  input.search { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
                 font: 500 20px var(--mono); padding: 14px 16px; border-radius: 6px; outline: none; }
  input.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #4ea1ff33; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .empty { color: var(--dim); padding: 40px; text-align: center; font-family: var(--mono); }

  /* ---------- Variant A: command bar + split card ---------- */
  .A { display: flex; flex-direction: column; height: 100%; padding: 16px 20px 70px; gap: 14px; }
  .A .bar { display: flex; gap: 12px; align-items: center; max-width: 900px; width: 100%; margin: 0 auto; }
  .A .hint { font: 11px var(--mono); color: var(--dim); text-align: center; margin-top: -8px; }
  .A .card { flex: 1; min-height: 0; display: grid; grid-template-columns: 420px 1fr; gap: 14px; }
  .A .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; overflow: auto; }
  .A h1 { font: 600 18px var(--sans); margin: 0 0 2px; }
  .A .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 12px; }
  .A dl { display: grid; grid-template-columns: 110px 1fr; gap: 5px 10px; margin: 0; }
  .A dt { color: var(--dim); } .A dd { margin: 0; }
  .A .actions { display: flex; gap: 8px; margin-top: 14px; }

  /* ---------- Variant B: master-detail with scan-queue rail ---------- */
  .B { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
  .B .rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .B .rail .top { padding: 12px; border-bottom: 1px solid var(--line); }
  .B .rail input.search { font-size: 15px; padding: 10px 12px; }
  .B .rail .label { font: 600 10px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; padding: 10px 12px 4px; }
  .B .list { overflow: auto; flex: 1; padding-bottom: 60px; }
  .B .row { padding: 7px 12px; border-left: 3px solid transparent; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .B .row:hover { background: var(--panel2); }
  .B .row.sel { background: var(--panel2); border-left-color: var(--accent); }
  .B .row .t { font: 600 12px var(--mono); } .B .row .n { color: var(--dim); font-size: 12px; grid-column: 1 / -1; }
  .B .main { overflow: auto; padding: 0 0 70px; }
  .B .head { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; }
  .B .head h1 { font: 600 16px var(--sans); margin: 0; flex: 1; }
  .B .grid { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .B .cell { padding: 8px 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .B .cell .k { font: 10px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .B .section { padding: 10px 18px 4px; font: 600 10px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .B table { font-family: var(--mono); font-size: 12px; }
  .B td, .B th { padding: 4px 18px; }

  /* ---------- Variant C: glance / helpdesk counter ---------- */
  .C { display: flex; flex-direction: column; height: 100%; }
  .C .top { padding: 14px 24px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); }
  .C .top input.search { font-size: 16px; padding: 9px 12px; max-width: 520px; }
  .C .banner { padding: 26px 32px; display: grid; grid-template-columns: 1fr auto; gap: 6px 24px; align-items: end; }
  .C .banner.s-green { background: linear-gradient(90deg, #2ea04333, transparent 70%); border-bottom: 2px solid var(--green); }
  .C .banner.s-amber { background: linear-gradient(90deg, #d2992233, transparent 70%); border-bottom: 2px solid var(--amber); }
  .C .banner.s-red   { background: linear-gradient(90deg, #e5534b33, transparent 70%); border-bottom: 2px solid var(--red); }
  .C .banner.s-grey  { background: linear-gradient(90deg, #6e768133, transparent 70%); border-bottom: 2px solid var(--grey); }
  .C .banner.s-blue  { background: linear-gradient(90deg, #388bfd33, transparent 70%); border-bottom: 2px solid var(--blue); }
  .C .status { font: 700 34px var(--sans); letter-spacing: -.01em; }
  .C .who { font: 500 22px var(--sans); }
  .C .who .dim { font-size: 14px; }
  .C .big { display: flex; gap: 10px; grid-row: 1 / 3; grid-column: 2; }
  .C .big .btn { padding: 14px 28px; font-size: 15px; }
  .C .strip { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
  .C .strip > div { padding: 10px 24px; border-right: 1px solid var(--line); }
  .C .strip .k { font: 10px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .C .log { flex: 1; overflow: auto; padding: 10px 24px 70px; font: 12px/1.7 var(--mono); }
  .C .log .ln { display: grid; grid-template-columns: 150px 90px 1fr; gap: 12px; border-bottom: 1px dashed #2a314088; }

  /* ---------- prototype switcher (not part of any design) ---------- */
  #switcher { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 99;
              display: flex; align-items: center; gap: 4px; background: #fff; color: #111; border-radius: 999px;
              padding: 4px; box-shadow: 0 6px 24px #000a; font: 600 12px var(--sans); }
  #switcher button { background: #111; color: #fff; border: 0; border-radius: 999px; width: 28px; height: 28px; }
  #switcher span { padding: 0 12px; min-width: 190px; text-align: center; }
  #switcher small { display: block; font-weight: 400; color: #666; font-size: 10px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="switcher">
  <button id="prev" title="Previous variant (←)">←</button>
  <span id="vlabel"></span>
  <button id="next" title="Next variant (→)">→</button>
</div>

<script>
// ---------- fake data (all names fictional) ----------
const TODAY = new Date('2026-09-24');
const assets = [
  { tag: 'NOMMA-004812', name: 'CB-LIB-012', serial: '5CD2381KQX', model: 'HP Chromebook 14 G7', category: 'Chromebook',
    status: 'Deployed', assignee: { type: 'User', name: 'Jordan Reyes', detail: 'Grade 8 · #20931' },
    location: 'Library', purchased: '2023-08-01', warrantyEnd: '2026-11-30', expectedCheckin: '2026-09-15',
    history: [
      ['2026-08-18 08:12', 'Checkout', 'E. Caldwell', 'to Jordan Reyes · due 2026-09-15'],
      ['2026-08-17 15:40', 'Checkin',  'E. Caldwell', 'from Sam Whitaker · "keyboard sticky"'],
      ['2025-08-20 09:03', 'Checkout', 'M. Ortiz',    'to Sam Whitaker'],
      ['2025-06-02 13:22', 'Checkin',  'M. Ortiz',    'from Priya Nand'],
      ['2024-08-19 10:11', 'Checkout', 'M. Ortiz',    'to Priya Nand'],
      ['2023-08-03 11:00', 'Update',   'Admin',       'created'],
    ] },
  { tag: 'NOMMA-004813', name: 'CB-LIB-013', serial: '5CD2381KR2', model: 'HP Chromebook 14 G7', category: 'Chromebook',
    status: 'Ready to Deploy', assignee: null, location: 'IT Storage B', purchased: '2023-08-01', warrantyEnd: '2026-11-30', expectedCheckin: null,
    history: [
      ['2026-06-05 14:02', 'Checkin',  'E. Caldwell', 'from Ava Lindqvist'],
      ['2025-08-21 08:30', 'Checkout', 'M. Ortiz',    'to Ava Lindqvist'],
      ['2023-08-03 11:00', 'Update',   'Admin',       'created'],
    ] },
  { tag: 'NOMMA-002207', name: 'PROJ-RM204', serial: 'X8JK0021554', model: 'Epson PowerLite 1781W', category: 'Projector',
    status: 'Deployed', assignee: { type: 'Location', name: 'Room 204', detail: 'Main building, 2F' },
    location: 'Room 204', purchased: '2021-07-12', warrantyEnd: '2024-07-12', expectedCheckin: null,
    history: [
      ['2024-09-02 07:45', 'Checkout', 'M. Ortiz', 'to Room 204'],
      ['2021-07-15 10:00', 'Update',   'Admin',    'created'],
    ] },
  { tag: 'NOMMA-005530', name: 'LT-STAFF-044', serial: 'PF3XK9Q1', model: 'Lenovo ThinkPad E14 Gen 5', category: 'Laptop',
    status: 'Pending', assignee: null, location: 'IT Bench', purchased: '2024-01-10', warrantyEnd: '2027-01-10', expectedCheckin: null,
    history: [
      ['2026-09-22 16:10', 'Checkin', 'E. Caldwell', 'from Dana Kowalski · "cracked hinge, sent for repair"'],
      ['2024-01-15 09:00', 'Checkout', 'M. Ortiz', 'to Dana Kowalski'],
      ['2024-01-12 12:00', 'Update', 'Admin', 'created'],
    ] },
  { tag: 'NOMMA-001190', name: 'IPAD-ART-03', serial: 'DMPXL3Q9J28', model: 'Apple iPad (9th gen)', category: 'Tablet',
    status: 'Archived', assignee: null, location: '—', purchased: '2019-08-01', warrantyEnd: '2020-08-01', expectedCheckin: null,
    history: [['2025-12-19 11:30', 'Update', 'E. Caldwell', 'status → Archived · "battery swollen, e-waste"']] },
  { tag: 'NOMMA-004901', name: 'CB-6B-07', serial: '5CD2390ZZA', model: 'HP Chromebook 14 G7', category: 'Chromebook',
    status: 'Deployed', assignee: { type: 'User', name: 'Mia Tran', detail: 'Grade 6 · #21877' },
    location: 'Room 6B', purchased: '2023-08-01', warrantyEnd: '2026-10-05', expectedCheckin: '2027-06-01',
    history: [['2026-08-18 08:40', 'Checkout', 'E. Caldwell', 'to Mia Tran · due 2027-06-01']] },
];

// ---------- helpers shared by all variants (data only, no layout) ----------
const days = d => Math.round((new Date(d) - TODAY) / 864e5);
const statusColor = s => ({ 'Deployed': 'blue', 'Ready to Deploy': 'green', 'Pending': 'amber', 'Archived': 'grey' }[s] || 'red');
function chips(a) {
  const out = [[a.status, statusColor(a.status)]];
  if (a.expectedCheckin && days(a.expectedCheckin) < 0) out.push([`Overdue ${-days(a.expectedCheckin)}d`, 'red']);
  const w = days(a.warrantyEnd);
  if (w < 0) out.push(['Warranty expired', 'grey']);
  else if (w <= 90) out.push([`Warranty ${w}d left`, 'amber']);
  return out.map(([t, c]) => `<span class="chip c-${c}">${t}</span>`).join('');
}
const assigneeText = a => a.assignee ? `${a.assignee.name}` : '<span class="dim">Unassigned</span>';
const assigneeDetail = a => a.assignee ? `${a.assignee.type} · ${a.assignee.detail}` : 'In inventory';
const actionBtns = a => `
  <button class="btn ${a.assignee ? '' : 'primary'}" ${a.assignee || a.status !== 'Ready to Deploy' ? 'disabled' : ''} onclick="stub('Checkout')">Checkout</button>
  <button class="btn ${a.assignee ? 'primary' : ''}" ${a.assignee ? '' : 'disabled'} onclick="stub('Checkin')">Checkin</button>`;
function stub(what) { alert(`PROTOTYPE: ${what} is a stub. No API calls.`); }

// Lookup: exact Asset Tag first (the scan path), else substring over name/tag/serial.
function lookup(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const exact = assets.filter(a => a.tag.toLowerCase() === q);
  return exact.length ? exact : assets.filter(a => [a.tag, a.name, a.serial].some(f => f.toLowerCase().includes(q)));
}

// ---------- state ----------
let query = 'NOMMA-004812';
let selected = assets[0];
let recent = [assets[0], assets[3], assets[2]]; // scan queue for variant B

// ---------- Variant A: command bar + split card ----------
function VariantA() {
  const a = selected;
  return `<div class="A">
    <div class="bar"><input class="search" id="q" value="${query}" placeholder="Scan or type Asset Tag, name, serial…" autofocus></div>
    <div class="hint">Enter = open · exact Asset Tag opens instantly · box clears after each scan</div>
    ${!a ? `<div class="empty">No Asset matches "${query}"</div>` : `
    <div class="card">
      <div class="pane">
        <div class="mono dim">${a.tag}</div>
        <h1>${a.name}</h1>
        <div class="dim">${a.model}</div>
        <div class="chips">${chips(a)}</div>
        <dl>
          <dt>Assignee</dt><dd>${assigneeText(a)}<div class="dim">${assigneeDetail(a)}</div></dd>
          <dt>Expected</dt><dd class="mono">${a.expectedCheckin || '—'}</dd>
          <dt>Location</dt><dd>${a.location}</dd>
          <dt>Category</dt><dd>${a.category}</dd>
          <dt>Serial</dt><dd class="mono">${a.serial}</dd>
          <dt>Purchased</dt><dd class="mono">${a.purchased}</dd>
          <dt>Warranty</dt><dd class="mono">${a.warrantyEnd}</dd>
        </dl>
        <div class="actions">${actionBtns(a)}</div>
      </div>
      <div class="pane">
        <table><tr><th>When</th><th>Action</th><th>By</th><th>Detail</th></tr>
        ${a.history.map(h => `<tr><td class="mono dim">${h[0]}</td><td>${h[1]}</td><td>${h[2]}</td><td>${h[3]}</td></tr>`).join('')}
        </table>
      </div>
    </div>`}
  </div>`;
}
VariantA.label = 'Command bar + split card';

// ---------- Variant B: master-detail with scan-queue rail ----------
function VariantB() {
  const a = selected;
  const results = query.trim() ? lookup(query) : [];
  const row = (x) => `<div class="row ${x === a ? 'sel' : ''}" data-tag="${x.tag}">
      <span class="t">${x.tag}</span><span>${chips(x).split('</span>')[0]}</span></span>
      <span class="n">${x.name} · ${x.assignee ? x.assignee.name : 'unassigned'}</span></div>`;
  return `<div class="B">
    <div class="rail">
      <div class="top"><input class="search" id="q" value="${query}" placeholder="Scan / search…" autofocus></div>
      <div class="list">
        ${results.length ? `<div class="label">Matches (${results.length})</div>${results.map(row).join('')}` : ''}
        <div class="label">Recent scans</div>${recent.map(row).join('')}
      </div>
    </div>
    <div class="main">${!a ? `<div class="empty">Scan an Asset Tag</div>` : `
      <div class="head"><span class="mono dim">${a.tag}</span><h1>${a.name} <span class="dim" style="font-weight:400">— ${a.model}</span></h1>${chips(a)} ${actionBtns(a)}</div>
      <div class="grid">
        <div class="cell"><div class="k">Assignee</div>${assigneeText(a)}</div>
        <div class="cell"><div class="k">Type</div>${a.assignee ? a.assignee.type : '—'}</div>
        <div class="cell"><div class="k">Expected checkin</div><span class="mono">${a.expectedCheckin || '—'}</span></div>
        <div class="cell"><div class="k">Location</div>${a.location}</div>
        <div class="cell"><div class="k">Category</div>${a.category}</div>
        <div class="cell"><div class="k">Serial</div><span class="mono">${a.serial}</span></div>
        <div class="cell"><div class="k">Purchased</div><span class="mono">${a.purchased}</span></div>
        <div class="cell"><div class="k">Warranty ends</div><span class="mono">${a.warrantyEnd}</span></div>
      </div>
      <div class="section">History</div>
      <table><tr><th>When</th><th>Action</th><th>Operator</th><th>Detail</th></tr>
      ${a.history.map(h => `<tr><td class="dim">${h[0]}</td><td>${h[1]}</td><td>${h[2]}</td><td>${h[3]}</td></tr>`).join('')}
      </table>`}
    </div>
  </div>`;
}
VariantB.label = 'Rail + detail sheet';

// ---------- Variant C: glance / helpdesk counter ----------
function VariantC() {
  const a = selected;
  return `<div class="C">
    <div class="top"><input class="search" id="q" value="${query}" placeholder="Scan…" autofocus><span class="dim mono">Scan → answer in one glance</span></div>
    ${!a ? `<div class="empty">No Asset matches "${query}"</div>` : `
    <div class="banner s-${a.expectedCheckin && days(a.expectedCheckin) < 0 ? 'red' : statusColor(a.status)}">
      <div class="status">${a.status}${a.expectedCheckin && days(a.expectedCheckin) < 0 ? ' · OVERDUE' : ''}</div>
      <div class="big">${actionBtns(a)}</div>
      <div class="who">${assigneeText(a)} <span class="dim">${assigneeDetail(a)}</span></div>
    </div>
    <div class="strip">
      <div><div class="k">Asset Tag</div><span class="mono">${a.tag}</span></div>
      <div><div class="k">Name</div>${a.name}</div>
      <div><div class="k">Model</div>${a.model}</div>
      <div><div class="k">Location</div>${a.location}</div>
      <div><div class="k">Serial</div><span class="mono">${a.serial}</span></div>
      <div><div class="k">Warranty</div><span class="mono">${a.warrantyEnd}</span></div>
      <div style="border:0;display:flex;gap:6px;align-items:center">${chips(a)}</div>
    </div>
    <div class="log">
      ${a.history.map(h => `<div class="ln"><span class="dim">${h[0]}</span><span>${h[1].toUpperCase()}</span><span>${h[2]} — ${h[3]}</span></div>`).join('')}
    </div>`}
  </div>`;
}
VariantC.label = 'Glance banner (helpdesk)';

// ---------- switcher wiring ----------
const VARIANTS = { A: VariantA, B: VariantB, C: VariantC };
const KEYS = Object.keys(VARIANTS);
let variant = new URLSearchParams(location.search).get('variant');
if (!KEYS.includes(variant)) variant = 'A';

function render() {
  document.getElementById('app').innerHTML = VARIANTS[variant]();
  document.getElementById('vlabel').innerHTML =
    `${variant} (${VARIANTS[variant].label})<small>${selected ? selected.tag : 'no Asset'} · query "${query}"</small>`;
  const q = document.getElementById('q');
  q.focus(); q.setSelectionRange(q.value.length, q.value.length);
  q.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    query = q.value;
    const hits = lookup(query);
    selected = hits[0] || null;
    if (selected) recent = [selected, ...recent.filter(x => x !== selected)].slice(0, 8);
    // a scan (exact tag hit) clears the box for the next scan; a text search keeps it
    if (hits.length === 1 && hits[0].tag.toLowerCase() === query.trim().toLowerCase()) query = '';
    render();
  });
  document.querySelectorAll('[data-tag]').forEach(r => r.onclick = () => {
    selected = assets.find(x => x.tag === r.dataset.tag); render();
  });
}
function go(step) {
  variant = KEYS[(KEYS.indexOf(variant) + step + KEYS.length) % KEYS.length];
  history.replaceState(null, '', `?variant=${variant}`);
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
render();
</script>
</body>
</html>
